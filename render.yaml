services:
  - type: web
    name: ai-supporter-v999
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-supporter-v999-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ai-supporter-v999-kv
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TEXT_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1
      - key: OPENAI_TRANSCRIBE_MODEL
        value: gpt-4o-mini-transcribe
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WEBHOOK_PATH
        value: /telegram/webhook
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_MESSAGE_CHARS
        value: "12000"
      - key: BROADCAST_PAUSE_MS
        value: "60"

  - type: keyvalue
    name: ai-supporter-v999-kv
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: Render web service access

databases:
  - name: ai-supporter-v999-db
    plan: free
